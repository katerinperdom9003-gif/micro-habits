<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#4a8f6a"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>Micro Habits</title>
<style>
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f6f4ef;color:#222;padding:20px 14px;text-align:center}
h1{font-size:23px;margin:6px 0 2px}#date{color:#777;margin-bottom:16px}
.today{display:flex;justify-content:center;gap:18px;margin-bottom:8px}
.ht{cursor:pointer;user-select:none;width:92px}.c{width:68px;height:68px;margin:0 auto 6px;border-radius:50%;border:4px solid #4a8f6a;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;transition:.15s}
.done .c{background:#4a8f6a}.ht b{font-size:14px}
#score{margin:10px 0 18px;font-size:16px}
.tabs{display:inline-flex;background:#e6e2d8;border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-size:14px}.tabs .on{background:#fff;font-weight:600}
.card{background:#fff;border-radius:16px;padding:14px 10px;max-width:460px;margin:0 auto;box-shadow:0 2px 8px #0001;overflow-x:auto}
table{border-collapse:collapse;margin:0 auto}td,th{padding:3px;font-size:11px;color:#777;font-weight:500}
th.n{text-align:left;font-size:13px;color:#222;padding-right:8px;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:50%;background:#e9e6de;margin:auto}.dot.y{background:#4a8f6a}
.small .dot{width:9px;height:9px}.small td{padding:1px}
.sum{font-size:13px;color:#555;margin-top:10px}
</style></head><body>
<h1>Micro Habits</h1><div id="date"></div>
<div class="today" id="today"></div><div id="score"></div>
<div class="tabs" id="tabs"></div>
<div class="card"><div id="grid"></div><div class="sum" id="sum"></div></div>
<script>
// Habits: add more here later.
const HABITS=[{id:"gym",name:"Exercise",icon:"🏋️"},{id:"eng",name:"English",icon:"🗣️"},{id:"read",name:"Reading",icon:"📖"}];
// Views: days = number of days back, or null for full history. Add more views here.
const VIEWS=[{id:"7",label:"7 days",days:7},{id:"30",label:"30 days",days:30},{id:"all",label:"All",days:null}];
const db=JSON.parse(localStorage.getItem("mh")||"{}");let view=localStorage.getItem("mhView")||"7";
const k=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=k(new Date());const save=()=>localStorage.setItem("mh",JSON.stringify(db));
function days(n){const out=[];if(n===null){const keys=Object.keys(db).sort();const first=keys[0]||today;
 for(let d=new Date(first+"T12:00");k(d)<=today;d.setDate(d.getDate()+1))out.push(new Date(d));return out}
 for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push(d)}return out}
function draw(){
 document.getElementById("date").textContent=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
 const t=db[today]||{},T=document.getElementById("today");T.innerHTML="";
 HABITS.forEach(h=>{const e=document.createElement("div");e.className="ht"+(t[h.id]?" done":"");
  e.innerHTML=`<div class="c">${t[h.id]?"✓":h.icon}</div><b>${h.name}</b>`;
  e.onclick=()=>{db[today]=db[today]||{};db[today][h.id]=!db[today][h.id];save();draw()};T.appendChild(e)});
 const n=HABITS.filter(h=>t[h.id]).length;document.getElementById("score").textContent=n==HABITS.length?"All done today! 🎉":`${n} of ${HABITS.length} done today`;
 const tb=document.getElementById("tabs");tb.innerHTML="";VIEWS.forEach(v=>{const b=document.createElement("button");b.textContent=v.label;if(v.id==view)b.className="on";
  b.onclick=()=>{view=v.id;localStorage.setItem("mhView",view);draw()};tb.appendChild(b)});
 const V=VIEWS.find(v=>v.id==view)||VIEWS[0],D=days(V.days),small=D.length>10;
 let h=`<table class="${small?"small":""}">`;if(!small)h+="<tr><th></th>"+D.map(d=>`<th>${d.toLocaleDateString("en-US",{weekday:"narrow"})}<br>${d.getDate()}</th>`).join("")+"</tr>";
 let sum=[];HABITS.forEach(hb=>{let c=0;h+=`<tr><th class="n">${hb.icon} ${small?"":hb.name}</th>`+D.map(d=>{const y=(db[k(d)]||{})[hb.id];if(y)c++;return `<td><div class="dot${y?" y":""}"></div></td>`}).join("")+"</tr>";sum.push(`${hb.name} ${c}/${D.length}`)});
 document.getElementById("grid").innerHTML=h+"</table>";document.getElementById("sum").textContent=sum.join(" · ")}
draw();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
